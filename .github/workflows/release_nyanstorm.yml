name: Release Nyanstorm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v7.2.4.80777 or v7.2.4.80777.windows.test)'
        required: true
        type: string

env:
  AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}/build-variables/variables
  BUILD_VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build-windows:
    if: ${{ !contains(inputs.version || github.ref_name, '.test') || endsWith(inputs.version || github.ref_name, '.windows.test') }}
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Nyanstorm
          fetch-depth: 0

      - name: Checkout build variables
        uses: actions/checkout@v4
        with:
          repository: FirestormViewer/fs-build-variables
          path: build-variables

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install autobuild and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        shell: bash

      - name: Set MSVC version
        run: echo "AUTOBUILD_VSVER=170" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Configure
        run: autobuild configure -c ReleaseFS_open -A64 -- --chan NyanstormEdition --package
        shell: bash

      - name: Build
        run: autobuild build -c ReleaseFS_open -A64 --no-configure
        shell: bash

      - name: Upload artifact
        if: ${{ !contains(env.BUILD_VERSION, '.test') }}
        uses: actions/upload-artifact@v4
        with:
          name: nyanstorm-windows
          path: build-vc*/newview/Release/*Setup.exe
          if-no-files-found: error

  build-linux:
    if: ${{ !contains(inputs.version || github.ref_name, '.test') || endsWith(inputs.version || github.ref_name, '.linux.test') }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Nyanstorm
          fetch-depth: 0

      - name: Checkout build variables
        uses: actions/checkout@v4
        with:
          repository: FirestormViewer/fs-build-variables
          path: build-variables

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install autobuild and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        shell: bash

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mesa-common-dev libgl1-mesa-dev libxinerama-dev libxrandr-dev \
            libpulse-dev libglu1-mesa-dev libfreetype6-dev libfontconfig1-dev
        shell: bash

      - name: Install GCC-13
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 130 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-13
          echo "CC=gcc-13" >> $GITHUB_ENV
          echo "CXX=g++-13" >> $GITHUB_ENV
        shell: bash

      - name: Configure
        run: autobuild configure -c ReleaseFS_open -A64 -- --chan NyanstormEdition --package
        shell: bash

      - name: Build
        run: autobuild build -c ReleaseFS_open -A64 --no-configure
        shell: bash

      - name: Upload artifact
        if: ${{ !contains(env.BUILD_VERSION, '.test') }}
        uses: actions/upload-artifact@v4
        with:
          name: nyanstorm-linux
          path: build-linux-*/newview/*.xz
          if-no-files-found: error

  build-macos:
    if: ${{ !contains(inputs.version || github.ref_name, '.test') || endsWith(inputs.version || github.ref_name, '.macos.test') }}
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: Nyanstorm
          fetch-depth: 0

      - name: Checkout build variables
        uses: actions/checkout@v4
        with:
          repository: FirestormViewer/fs-build-variables
          path: build-variables

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install autobuild and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        shell: bash

      - name: Install Bash 4 and GNU sed
        run: |
          brew install bash gnu-sed
          echo "/usr/local/bin" >> $GITHUB_PATH
          echo "$(brew --prefix)/opt/gnu-sed/libexec/gnubin" >> $GITHUB_PATH
        shell: bash

      - name: Install llbase for system Python (macOS)
        run: |
          /usr/bin/python3 -m pip install llbase llsd --break-system-packages 2>/dev/null || \
          /usr/bin/python3 -m pip install llbase llsd
        shell: bash

      - name: Configure
        run: autobuild configure -c ReleaseFS_open -A64 -- --chan NyanstormEdition --package
        shell: bash

      - name: Build
        run: autobuild build -c ReleaseFS_open -A64 --no-configure
        shell: bash

      - name: Upload artifact
        if: ${{ !contains(env.BUILD_VERSION, '.test') }}
        uses: actions/upload-artifact@v4
        with:
          name: nyanstorm-macos
          path: build-darwin-*/newview/*.dmg
          if-no-files-found: error

  release:
    if: ${{ !contains(inputs.version || github.ref_name, '.test') }}
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_VERSION }}
          name: Nyanstorm ${{ env.BUILD_VERSION }}
          files: dist/**/*
          generate_release_notes: false
